[package]
name = "meridian-desktop"
version = "2.1.0"
description = "Meridian als Desktop-App"
authors = ["Vanzal"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "meridian_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
