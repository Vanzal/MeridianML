name: windows-installer

# Baut dist/Meridian-Setup-<version>.exe. Bei einem Tag wie v2.1.0 wird der Installer an ein GitHub-Release gehängt.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Werkzeuge installieren (NSIS, windres)
        run: sudo apt-get update && sudo apt-get install -y nsis binutils-mingw-w64-x86-64
      - name: Launcher prüfen
        working-directory: packaging/windows/launcher
        run: go vet ./... && GOOS=windows GOARCH=amd64 go vet ./...
      - name: Installer bauen
        run: packaging/windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Meridian-Setup
          path: dist/Meridian-Setup-*.exe*
      - name: An Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Meridian-Setup-*.exe*
