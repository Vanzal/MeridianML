name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt maturin
      - name: Tests (reines Python)
        run: MERIDIAN_PURE_PYTHON=1 python -m pytest -q
      - name: Rust-Tokenizer bauen
        run: |
          maturin build --release -m rust/meridian_fastbpe/Cargo.toml -o wheels
          pip install wheels/*.whl
      - name: Tests (mit Rust-Tokenizer, inkl. Gleichheit Rust = Python)
        run: python -m pytest -q
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Launcher prüfen und testen
        working-directory: packaging/windows/launcher
        env:
          GOFLAGS: -mod=mod   # fehlende go.sum-Einträge ergänzen (geprüft gegen sum.golang.org)
        run: go vet ./... && GOOS=windows GOARCH=amd64 go vet ./... && go test ./...
  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux-Pakete für Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - name: Startprogramm der Desktop-App prüfen und testen
        run: |
          python desktop/scripts/stage.py
          cd desktop/src-tauri && cargo test
