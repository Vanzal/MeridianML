name: desktop

# Baut die Desktop-App (Tauri) für Windows, macOS und Linux, jeweils mit dem Rust-Tokenizer.
# Bei einem Tag wie v2.2.0 hängen die Installer am GitHub-Release; sonst unter "Artifacts" des Laufs
# (Actions -> desktop -> Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux-Pakete für Tauri
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: Rust-Tokenizer bauen
        shell: bash
        run: |
          pip install "maturin>=1.7,<2"
          maturin build --release -m rust/meridian_fastbpe/Cargo.toml -o build/wheels
      - name: Vorbereiten (App-Dateien, uv, Wheels)
        working-directory: desktop
        run: |
          npm ci
          python scripts/stage.py
      - name: Tests des Startprogramms
        working-directory: desktop/src-tauri
        run: cargo test
      - name: App bauen
        working-directory: desktop
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Meridian-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
      - name: An Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
