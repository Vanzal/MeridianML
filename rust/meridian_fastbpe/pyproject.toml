[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "meridian-fastbpe"
version = "2.1.0"
description = "Rust-Kern für den BPE-Tokenizer von Meridian"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.maturin]
module-name = "meridian_fastbpe"
features = ["pyo3/extension-module"]
